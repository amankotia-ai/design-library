<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Film preview</title><style>*{box-sizing:border-box}body{margin:0;background:#202820;color:#fff;font:16px system-ui}main{max-width:1440px;margin:auto;padding:24px}#screen{position:relative;width:100%;overflow:hidden;background:#111}iframe{position:absolute;top:0;left:0;transform-origin:top left;border:0}nav{display:flex;align-items:center;gap:12px;padding:20px 0;flex-wrap:wrap}button,input,select{font:inherit}button,select{padding:8px}#scrub{flex:1;min-width:200px}#frame{width:110px}output{font-variant-numeric:tabular-nums}#error{color:#ffb9a6}a{color:#c8e2b1}</style></head><body><main><h1 id="title">Film preview</h1><div id="screen"><iframe id="film" src="/index.html" title="Film stage"></iframe></div><nav aria-label="Preview controls"><button id="play" type="button">Play</button><button id="back" type="button" aria-label="Previous frame">−1 frame</button><button id="next" type="button" aria-label="Next frame">+1 frame</button><label for="scrub">Timeline</label><input id="scrub" type="range" min="0" value="0" step="0.01"><label for="frame">Frame</label><input id="frame" type="number" min="0" value="0" step="0.01"><label for="speed">Speed</label><select id="speed"><option value="1">1×</option><option value="0.5">½×</option><option value="0.25">¼×</option></select><output id="time"></output></nav><p id="error" role="alert"></p><p>Preview is silent. Export audio is muxed separately. Frames are rendered from absolute time; dragging never advances a simulation.</p></main><script type="module" src="/lib/preview.js"></script></body></html>
